site:
  name: Best Visual
  site: 'https://bestvisual.ae'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: null

# Default SEO metadata
metadata:
  title:
    default: Best Visual | Real Estate, Business Setup & Project Management | UAE · Germany · Spain
    template: '%s — Best Visual'
  description: 'Best Visual (RAKEZ, Ras Al Khaimah) provides real estate consultancy & brokerage, marketing management, content creation, corporate design, project management, business consulting and business setup support across the UAE, Germany, and Spain.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Best Visual
    type: website
  twitter:
    handle: null
    site: null
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr
  locales: ['en', 'de', 'es']
  defaultLocale: en
  localeNames:
    en: English
    de: Deutsch
    es: Español
  ai:
    provider: 'deepl'
    geminiApiKey: null

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'insights'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 3

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'

navigation:
  actions:
    - text: 'Speak with us'
      href: '/contact'
      icon: 'tabler:phone'
      variant: 'primary'

  footer:
    secondaryLinks:
      - text: 'Terms of Service'
        page: 'terms'
      - text: 'Privacy Policy'
        page: 'privacy'
    footNote: '©2026 Best Visual FZE · RAKEZ, Ras Al Khaimah, UAE · <a class="text-blue-600 underline dark:text-muted" href="mailto:info@bestvisual.ae">info@bestvisual.ae</a>'

  blog:
    categorySlug: 'insights'
    tagSlug: 'uae'
