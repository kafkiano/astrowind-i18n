site:
  name: artesano
  site: 'https://artesanomoraira.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: null

# Default SEO metadata
metadata:
  title:
    default: artesano — Gallery · Café · Juice Bar
    template: '%s — artesano'
  description: 'Artesano is a unique combination of art gallery, coffee shop, juice bar, café/restaurant and cocktail lounge in Moraira, Alicante. Fresh, healthy, made-to-order dishes with vegetarian, vegan and gluten free options.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: artesano
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: null
    site: null
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr
  locales: ['en', 'es', 'fr', 'de', 'nl']
  defaultLocale: en
  localeNames:
    en: English
    es: Español
    fr: Français
    de: Deutsch
    nl: Nederlands
  ai:
    provider: 'deepl'
    geminiApiKey: null

apps:
  blog:
    isEnabled: false

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'

navigation:
  actions:
    - text: 'Call us'
      href: 'tel:+34966272127'
      icon: 'tabler:phone'
    - text: 'Directions'
      href: 'https://maps.google.com/?q=Carretera+Moraira-Calpe+16a+03724+Moraira+Alicante+España'
      target: '_blank'
      icon: 'tabler:map-pin'

  footer:
    secondaryLinks:
      - text: 'Privacy Policy'
        page: 'privacy'
    footNote: '©2026 artesano · Carretera Moraira-Calpe 16a, 03724 Moraira, Alicante, España'
