# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: kafkiano/astrowind-i18n
  branch: main

media_folder: src/assets/images
public_folder: ~/assets/images

collections:
  - name: posts
    label: Blog Posts
    label_singular: Post
    folder: src/data/post/en
    create: true
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string

      - label: Publish Date
        name: publishDate
        widget: datetime
        date_format: 'DD.MM.YYYY'
        time_format: 'HH:mm'
        format: 'YYYY-MM-DDTHH:mm:ss[Z]'
        picker_utc: true

      - label: Excerpt
        name: excerpt
        widget: text

      - label: Image URL
        name: image
        widget: string

      - label: Category
        name: category
        widget: string
        required: false

      - label: Tags
        name: tags
        widget: list
        required: false
        field: { label: Tag, name: tag, widget: string }

      - label: Metadata
        name: metadata
        widget: object
        required: false
        fields:
          - label: Canonical URL
            name: canonical
            widget: string
            required: false

      - label: Body
        name: body
        widget: markdown

  - name: snippets
    label: Snippets
    label_singular: Snippet
    folder: src/data/snippets
    create: true
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
        required: false

      - label: Content
        name: body
        widget: markdown

  - name: pages
    label: Pages
    label_singular: Page
    folder: src/data/pages/en
    create: true
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string

      - label: Show in navigation
        name: showIn
        widget: select
        options: ['header', 'footer', 'none']
        default: footer
        required: false

      - label: Order
        name: order
        widget: number
        default: 999
        required: false

      - label: Group
        name: group
        widget: string
        required: false

      - label: Body
        name: body
        widget: markdown
        required: false

  - name: templates
    label: Page Templates
    label_singular: Template
    folder: src/data/templates/en
    create: true
    extension: md
    format: frontmatter
    description: >
      Data files for custom .astro page templates.
      These are NOT standalone pages — they are consumed
      by specific .astro templates via getEntry().
      All frontmatter fields are free-form; add whatever
      sections your template expects.
    fields:
      - label: Title
        name: title
        widget: string
        hint: Used for metadata. The template reads all other fields from frontmatter.

      - label: Body
        name: body
        widget: markdown
        required: false
        hint: Optional. Some templates use the body, others ignore it.
