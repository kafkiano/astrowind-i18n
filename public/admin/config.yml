# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: kafkiano/astrowind-i18n
  branch: main

media_folder: src/assets/images
public_folder: ~/assets/images

collections:
  - name: posts
    label: Blog Posts
    label_singular: Post
    folder: src/data/post/en
    create: true
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string

      - label: Publish Date
        name: publishDate
        widget: datetime
        date_format: 'DD.MM.YYYY'
        time_format: 'HH:mm'
        format: 'YYYY-MM-DDTHH:mm:ss[Z]'
        picker_utc: true

      - label: Excerpt
        name: excerpt
        widget: text

      - label: Image URL
        name: image
        widget: string

      - label: Category
        name: category
        widget: string
        required: false

      - label: Tags
        name: tags
        widget: list
        required: false
        field: { label: Tag, name: tag, widget: string }

      - label: Metadata
        name: metadata
        widget: object
        required: false
        fields:
          - label: Canonical URL
            name: canonical
            widget: string
            required: false

      - label: Body
        name: body
        widget: markdown

  - name: snippets
    label: Snippets
    label_singular: Snippet
    folder: src/data/snippets/en
    create: true
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
        required: false

      - label: Content
        name: body
        widget: markdown

  - name: pages
    label: Pages
    label_singular: Page
    folder: src/data/pages/en
    create: true
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string

      - label: Show in navigation
        name: showIn
        widget: select
        options: ['header', 'footer', 'none']
        default: footer
        required: false

      - label: Order
        name: order
        widget: number
        default: 999
        required: false

      - label: Group
        name: group
        widget: string
        required: false

      - label: Body
        name: body
        widget: markdown
        required: false

  - name: templates
    label: Page Templates
    label_singular: Template
    folder: src/data/templates/en
    create: false
    extension: md
    format: frontmatter
    description: >
      Data files for custom .astro page templates.
      These are NOT standalone pages — they are consumed
      by specific .astro templates via getEntry().
      All structured content lives in frontmatter.
    fields:
      - label: Title
        name: title
        widget: string
        hint: Browser tab title.

      - label: Hero
        name: hero
        widget: object
        fields:
          - label: Tagline
            name: tagline
            widget: string
            required: false
          - label: Title
            name: title
            widget: string
          - label: Subtitle
            name: subtitle
            widget: string
            required: false
          - label: Image
            name: image
            widget: object
            required: false
            fields:
              - label: Source
                name: src
                widget: image
              - label: Alt text
                name: alt
                widget: string
          - label: Actions
            name: actions
            widget: list
            required: false
            fields:
              - label: Button text
                name: text
                widget: string
              - label: Link
                name: href
                widget: string
              - label: Style
                name: variant
                widget: select
                options: ['primary', 'secondary', 'outline']
                default: primary
                required: false
              - label: Icon
                name: icon
                widget: string
                required: false
                hint: 'tabler icon name, e.g. tabler:brand-github'

      - label: Features
        name: features
        widget: object
        required: false
        fields:
          - label: Tagline
            name: tagline
            widget: string
            required: false
          - label: Title
            name: title
            widget: string
          - label: Items
            name: items
            widget: list
            fields:
              - label: Title
                name: title
                widget: string
              - label: Description
                name: description
                widget: text
              - label: Icon
                name: icon
                widget: string
                required: false
                hint: 'tabler icon name, e.g. tabler:edit'

      - label: Testimonials
        name: testimonials
        widget: list
        required: false
        fields:
          - label: Title
            name: title
            widget: string
            required: false
          - label: Quote
            name: testimonial
            widget: text
          - label: Author
            name: name
            widget: string

      - label: Call to Action
        name: cta
        widget: object
        required: false
        fields:
          - label: Title
            name: title
            widget: string
          - label: Subtitle
            name: subtitle
            widget: string
            required: false
          - label: Buttons
            name: actions
            widget: list
            fields:
              - label: Button text
                name: text
                widget: string
              - label: Link
                name: href
                widget: string
              - label: Style
                name: variant
                widget: select
                options: ['primary', 'secondary', 'outline']
                default: primary
                required: false
              - label: Icon
                name: icon
                widget: string
                required: false
                hint: 'tabler icon name, e.g. tabler:download'
              - label: Open in new tab
                name: target
                widget: select
                options: ['_blank', '_self']
                default: _self
                required: false

      - label: Body
        name: body
        widget: markdown
        required: false
        hint: Optional markdown body. Leave empty if all content is in the sections above.
